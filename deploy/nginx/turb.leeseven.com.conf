# 证书签发完成后启用；沿用服务器现有 Cloudflare 来源限制。
server {
    listen 80;
    listen [::]:80;
    server_name turb.leeseven.com;
    root /var/www/html;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }
    location / { return 301 https://turb.leeseven.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name turb.leeseven.com;
    include snippets/cloudflare-only.conf;
    ssl_certificate /etc/letsencrypt/live/turb.leeseven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turb.leeseven.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
