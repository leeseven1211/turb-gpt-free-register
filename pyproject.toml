[project]
name = "turb-gpt-free-register"
version = "0.0.0"
description = "ChatGPT / OpenAI account registration and Codex OAuth console"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["logs", "run", "migration", "accounts", "codex_accounts", "output", ".venv"]

[tool.ruff.lint]
select = ["E9", "F821"]
