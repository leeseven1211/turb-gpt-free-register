services:
  postgres:
    image: postgres:16-alpine
    container_name: turb-gpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: turb_console
      POSTGRES_USER: turb
      POSTGRES_PASSWORD: turb_local_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - turb_gpt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turb -d turb_console"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  turb_gpt_postgres_data:
