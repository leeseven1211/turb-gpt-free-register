<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-foundation.css') }}">
  <title>Turb Console · 安全登录</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ui-color-bg);
      color: var(--ui-color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91, 92, 226, 0.12) 0%, rgba(91, 92, 226, 0) 70%);
    }

    .bg-circle--tl {
      width: 420px;
      height: 420px;
      top: -120px;
      right: -80px;
    }

    .bg-circle--br {
      width: 360px;
      height: 360px;
      bottom: -100px;
      right: -60px;
      left: auto;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0) 70%);
    }

    .bg-quarter-bl {
      position: absolute;
      bottom: 0;
      left: 0;
      width: min(420px, 55vw);
      height: min(420px, 55vw);
      border-radius: 0 100% 0 0;
      background: #e8ecf3;
    }

    .bg-dots {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(6, 10px);
      grid-template-rows: repeat(4, 10px);
      gap: 10px;
      place-items: center;
    }

    .bg-dots span {
      display: block;
      border-radius: 50%;
      background: #94a3b8;
    }

    .bg-dots--tl { top: 48px; left: 56px; }
    .bg-dots--br { bottom: 56px; right: 64px; }

    .page {
      position: relative;
      z-index: 1;
      width: min(440px, calc(100vw - 40px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ui-color-text);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
    }

    .brand-subtitle {
      color: var(--ui-color-text-subtle);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .card {
      width: 100%;
      padding: 36px 32px 32px;
      border: 1px solid var(--ui-color-border);
      border-radius: var(--ui-radius-xl);
      background: var(--ui-color-surface);
      box-shadow: var(--ui-shadow-md);
    }

    .card h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: var(--ui-color-text);
      letter-spacing: -0.02em;
    }

    .desc {
      margin: 10px 0 0;
      text-align: center;
      color: var(--ui-color-text-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .err {
      margin: 18px 0 0;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--ui-color-danger) 28%, white);
      border-radius: 10px;
      background: var(--ui-color-danger-soft);
      color: var(--ui-color-danger);
      font-size: 13px;
      line-height: 1.45;
    }

    .field {
      margin-top: 24px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--ui-color-text-subtle);
      pointer-events: none;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ui-color-text-subtle);
      cursor: pointer;
      padding: 0;
    }

    .toggle-password:hover {
      color: var(--ui-color-text-secondary);
      background: var(--ui-color-surface-subtle);
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
    }

    .toggle-password .icon-hide { display: none; }
    .toggle-password.is-visible .icon-show { display: none; }
    .toggle-password.is-visible .icon-hide { display: block; }

    .input-wrap input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--ui-color-border-strong);
      border-radius: var(--ui-radius-lg);
      padding: 0 44px 0 42px;
      font: inherit;
      font-size: 14px;
      color: var(--ui-color-text);
      background: var(--ui-color-surface);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap input::placeholder {
      color: var(--ui-color-text-subtle);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: #a7a8f4;
      box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.12);
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: var(--ui-color-text-muted);
      font-size: 13px;
      user-select: none;
      cursor: pointer;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--ui-color-brand);
      cursor: pointer;
    }

    .submit {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
      border: 0;
      border-radius: var(--ui-radius-lg);
      background: var(--ui-color-brand);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .submit:hover {
      background: var(--ui-color-brand-hover);
    }

    .submit:active {
      transform: scale(0.99);
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.78;
    }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ui-color-text-subtle);
      font-size: 11px;
      text-align: center;
    }

    .security-note svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .page {
        width: min(100% - 24px, 440px);
        padding: max(42px, env(safe-area-inset-top)) 0 32px;
        gap: 22px;
      }

      .card {
        padding: 30px 22px 24px;
      }

      .bg-dots { display: none; }
    }

    @media (max-height: 620px) {
      body {
        align-items: flex-start;
        overflow-y: auto;
      }

      .page { padding-block: 28px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-quarter-bl"></div>
    <div class="bg-circle bg-circle--tl"></div>
    <div class="bg-circle bg-circle--br"></div>
    <div class="bg-dots bg-dots--tl" data-rows="4" data-cols="6"></div>
    <div class="bg-dots bg-dots--br" data-rows="4" data-cols="6"></div>
  </div>

  <div class="page">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 44 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="10" y1="4" x2="34" y2="44" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5b5ce2"/>
            <stop offset="1" stop-color="#7c5cff"/>
          </linearGradient>
        </defs>
        <path d="M22 3L38.928 12.75V35.25L22 45L5.072 35.25V12.75L22 3Z" fill="url(#logoGrad)"/>
        <path d="M22 13L30.928 18.25V29.75L22 35L13.072 29.75V18.25L22 13Z" fill="white" fill-opacity="0.92"/>
      </svg>
      <span class="brand-copy"><span class="brand-title">Turb Console</span><span class="brand-subtitle">Registration ops</span></span>
    </div>

    <form class="card" method="post" action="{{ login_url }}" aria-describedby="loginDescription">
      <h1>安全访问</h1>
      <p class="desc" id="loginDescription">请输入启动命令或配置文件中设置的授权码</p>
      {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}

      <div class="field">
        <label class="sr-only" for="authCodeInput">授权码</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
          <input id="authCodeInput" name="auth_code" type="password" autocomplete="current-password" autofocus required placeholder="请输入授权码">
          <button class="toggle-password" id="togglePassword" type="button" aria-label="显示授权码" title="显示/隐藏">
            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <label class="remember">
          <input id="rememberAuthCode" name="remember" type="checkbox" value="1">
          记住授权码
        </label>
      </div>

      <input name="next" type="hidden" value="{{ next_url }}">
      <button class="submit" id="loginSubmit" type="submit">进入控制台</button>
    </form>
    <div class="security-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>本地安全访问 · 授权码仅用于控制台鉴权</span></div>
  </div>

  <script>
    (() => {
      const key = 'webui_auth_code';
      const input = document.getElementById('authCodeInput');
      const remember = document.getElementById('rememberAuthCode');
      const toggle = document.getElementById('togglePassword');
      const submit = document.getElementById('loginSubmit');
      const saved = localStorage.getItem(key) || '';
      if (saved) { input.value = saved; remember.checked = true; }
      document.querySelector('form').addEventListener('submit', () => {
        if (remember.checked) localStorage.setItem(key, input.value || '');
        else localStorage.removeItem(key);
        submit.disabled = true;
        submit.textContent = '验证中…';
      });
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.classList.toggle('is-visible', show);
        toggle.setAttribute('aria-label', show ? '隐藏授权码' : '显示授权码');
      });

      document.querySelectorAll('.bg-dots').forEach((grid) => {
        const rows = Number(grid.dataset.rows || 4);
        const cols = Number(grid.dataset.cols || 6);
        const rowMid = (rows - 1) / 2;
        const colMid = (cols - 1) / 2;
        let maxDist = 0;
        const cells = [];
        for (let r = 0; r < rows; r += 1) {
          for (let c = 0; c < cols; c += 1) {
            const dist = Math.hypot(r - rowMid, c - colMid);
            maxDist = Math.max(maxDist, dist);
            cells.push({ dist });
          }
        }
        cells.forEach(({ dist }) => {
          const t = dist / maxDist;
          const size = 7.5 - t * 3.5;
          const opacity = 0.55 - t * 0.3;
          const dot = document.createElement('span');
          dot.style.width = `${size}px`;
          dot.style.height = `${size}px`;
          dot.style.opacity = String(opacity);
          grid.appendChild(dot);
        });
      });
    })();
  </script>
</body>
</html>
