<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg', v='20261030-layout-v2') }}" type="image/svg+xml">
  <title>GPT 注册控制台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css', v='20261112-account-actions-c2a-01') }}">
  <!-- Shared UI foundation. Keep module-specific styles above while pages migrate to these tokens. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/ui-foundation.css', v='20261110-task-receipts') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/bulk.css', v='20261112-task-report-button-01') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/bulk-report.css', v='20261112-task-report-button-01') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/config.css', v='20261107-remove-menu-help') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/extract_link.css', v='20261112-workbench-search-inline-01') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/extract_stats.css', v='20261112-workbench-stats-01') }}">
  <style>
    #accountsPanelV2 :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) { flex-wrap: wrap; overflow: visible; align-items: center; }
    :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) details { min-width: 0; max-width: 100%; font-size: 12px; }
    :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) summary { cursor: pointer; }
    :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) ul { max-height: 220px; overflow: auto; padding-left: 22px; margin: 8px 0 0; }
    :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) li { margin-bottom: 6px; overflow-wrap: anywhere; }
    :is(#accountRegistrationRetryResultV2, #accountC2aReimportResultV2) :is(button, summary):focus-visible { outline: 2px solid var(--ui-color-brand); outline-offset: 2px; }
    #c2aReimportConfirmModal { width: min(620px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--ui-color-border); border-radius: var(--ui-radius-md); color: var(--ui-color-text); background: var(--ui-color-surface); box-shadow: var(--ui-shadow-md); }
    #c2aReimportConfirmModal::backdrop { background: rgb(12 20 37 / 52%); }
    #c2aReimportConfirmModal .c2a-reimport-confirm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px; border-bottom: 1px solid var(--ui-color-border); }
    #c2aReimportConfirmModal .c2a-reimport-confirm-kicker { margin: 0 0 6px; color: var(--ui-color-text-muted); font-size: 11px; font-weight: 700; }
    #c2aReimportConfirmModal h3 { margin: 0; font-size: 18px; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-head p:last-child { margin: 6px 0 0; color: var(--ui-color-text-secondary); font-size: 13px; line-height: 1.55; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-close { flex: 0 0 auto; min-width: 36px; min-height: 36px; padding: 4px 10px; border: 1px solid var(--ui-color-border-strong); border-radius: var(--ui-radius-sm); color: var(--ui-color-text-secondary); background: var(--ui-color-surface); font: inherit; cursor: pointer; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-body { display: grid; gap: 12px; max-height: min(58dvh, 520px); padding: 20px; overflow: auto; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-scope { margin: 0; font-size: 14px; line-height: 1.55; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-scope strong { font-variant-numeric: tabular-nums; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-note { padding: 12px 14px; border: 1px solid var(--ui-color-border); border-radius: var(--ui-radius-sm); background: var(--ui-color-surface-raised, var(--ui-color-surface)); }
    #c2aReimportConfirmModal .c2a-reimport-confirm-note h4 { margin: 0 0 6px; font-size: 14px; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-note p, #c2aReimportConfirmModal .c2a-reimport-confirm-note ul { margin: 0; color: var(--ui-color-text-secondary); font-size: 13px; line-height: 1.6; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-note ul { padding-left: 20px; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-note--warning { border-color: var(--ui-color-warning-border, var(--ui-color-border-strong)); background: var(--ui-color-warning-soft); }
    #c2aReimportConfirmModal .c2a-reimport-confirm-status { margin: 0; color: var(--ui-color-text-secondary); font-size: 13px; line-height: 1.5; }
    #c2aReimportConfirmModal .c2a-reimport-confirm-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--ui-color-border); }
    #c2aReimportConfirmModal .c2a-reimport-confirm-foot .jobs-tb-btn { min-height: 40px; }
    #c2aReimportConfirmModal :is(button, summary):focus-visible { outline: 3px solid var(--ui-color-brand); outline-offset: 3px; }
    #c2aReimportConfirmModal :disabled { opacity: .6; cursor: not-allowed; }
    @media (max-width: 640px) {
      #c2aReimportConfirmModal .c2a-reimport-confirm-head, #c2aReimportConfirmModal .c2a-reimport-confirm-body { padding: 16px; }
      #c2aReimportConfirmModal .c2a-reimport-confirm-foot { padding: 12px 16px; }
      #c2aReimportConfirmModal .c2a-reimport-confirm-foot .jobs-tb-btn { flex: 1 1 0; min-height: 44px; justify-content: center; }
    }
  </style>
</head>
<body>
<aside class="app-sidebar" aria-label="主导航">
  <div class="sidebar-brand">
    <svg class="sidebar-brand-icon" viewBox="0 0 44 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sidebarLogoGrad" x1="10" y1="4" x2="34" y2="44" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3b66f5"/>
          <stop offset="1" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <path d="M22 3L38.928 12.75V35.25L22 45L5.072 35.25V12.75L22 3Z" fill="url(#sidebarLogoGrad)"/>
      <path d="M22 13L30.928 18.25V29.75L22 35L13.072 29.75V18.25L22 13Z" fill="white" fill-opacity="0.92"/>
    </svg>
    <span class="sidebar-brand-copy">
      <span class="sidebar-brand-title">Turb Console</span>
      <span class="sidebar-brand-subtitle">Registration ops</span>
    </span>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-group-label">工作区</div>
    <button type="button" data-tab="overview" class="sidebar-item active">
      <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="sidebar-item-label">总览</span>
    </button>
    <div class="sidebar-module" data-sidebar-module="register">
      <button type="button" data-tab="register" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="sidebar-item-label">注册</span><span class="sidebar-item-meta">Live</span>
      </button>
      <div class="sidebar-subnav" data-module-subnav="register" aria-label="注册中心子菜单">
        <button type="button" class="is-active" data-view="launch">发起注册</button>
      </div>
    </div>
    <div class="sidebar-module" data-sidebar-module="accounts">
      <button type="button" data-tab="accounts" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="sidebar-item-label">账号</span>
      </button>
      <div class="sidebar-subnav" data-module-subnav="accounts" aria-label="账号资产子菜单">
        <button type="button" class="is-active" data-view="active">活跃账号</button>
        <button type="button" data-view="archived">归档账号</button>
      </div>
    </div>
    <div class="sidebar-module" data-sidebar-module="codex">
      <button type="button" data-tab="codex" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="sidebar-item-label">Codex 授权</span>
      </button>
      <div class="sidebar-subnav" data-module-subnav="codex" aria-label="Codex 授权子菜单">
        <button type="button" class="is-active" data-view="active">活跃账号</button>
        <button type="button" data-view="archived">归档账号</button>
      </div>
    </div>
    <div class="sidebar-module" data-sidebar-module="bulk">
      <button type="button" data-tab="bulk" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="m14 17 3 3 4-6"/></svg>
        <span class="sidebar-item-label">批量任务</span>
      </button>
      <div class="sidebar-subnav" aria-label="批量任务子菜单">
        <button type="button" data-bulk-nav="list">批次列表</button>
        <button type="button" data-bulk-nav="create">新建批次</button>
      </div>
    </div>
    <button type="button" data-tab="tasks" class="sidebar-item">
      <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11"/><circle cx="4" cy="5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="19" r="1"/></svg>
      <span class="sidebar-item-label">任务中心</span><span class="sidebar-item-meta">统一</span>
    </button>
    <button type="button" data-tab="extract-workbench" class="sidebar-item">
      <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h10M4 19h7"/><path d="m17 15 3 3-3 3"/><path d="M20 18h-6"/></svg>
      <span class="sidebar-item-label">提链工作台</span>
    </button>
    <button type="button" data-tab="extract-stats" class="sidebar-item">
      <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v17h17M8 15v-4M13 15V7M18 15V4"/></svg>
      <span class="sidebar-item-label">提链统计</span>
    </button>
    <div class="sidebar-module" data-sidebar-module="outlook">
      <button type="button" data-tab="outlook" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
        <span class="sidebar-item-label">邮箱池</span>
      </button>
      <div class="sidebar-subnav" data-module-subnav="outlook" aria-label="邮箱资源池子菜单">
        <button type="button" class="is-active" data-view="overview">资源总览</button>
        <button type="button" data-view="list">邮箱列表</button>
        <button type="button" data-view="derivations">历史子邮箱</button>
      </div>
    </div>
    <div class="sidebar-module" data-sidebar-module="proxy-traffic">
      <button type="button" data-tab="proxy-traffic" class="sidebar-item">
        <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.5 3.7 5.5 3.7 9s-1.3 6.5-3.7 9c-2.4-2.5-3.7-5.5-3.7-9S9.6 5.5 12 3z"/></svg>
        <span class="sidebar-item-label">代理与流量</span>
      </button>
      <div class="sidebar-subnav" data-module-subnav="proxy-traffic" aria-label="代理与流量子菜单">
        <button type="button" class="is-active" data-view="pool">代理池库存</button>
        <button type="button" data-view="records">租约与流量</button>
      </div>
    </div>
    <div class="sidebar-nav-group-label">系统</div>
    <button type="button" data-tab="config" class="sidebar-item">
      <svg class="sidebar-item-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="sidebar-item-label">配置</span>
      <span class="sidebar-item-meta config-dirty-badge" id="configDirtyBadge" hidden>0</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <form class="sidebar-logout" method="post" action="/logout">
      <button type="submit">
        <svg class="sidebar-footer-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>退出登录</span>
      </button>
    </form>
  </div>
</aside>

<div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>
<header class="app-topbar">
  <div class="topbar-leading">
    <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="打开导航" aria-expanded="false">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button type="button" class="nav-history-back" id="navHistoryBack" aria-label="返回上一个菜单" title="返回上一个菜单" disabled>
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
  </div>
  <div class="topbar-heading">
    <div class="topbar-eyebrow">Turb workspace</div>
    <div class="topbar-title-row">
      <h1 class="topbar-title" id="topbarTitle">注册中心</h1>
      <span class="topbar-description" id="topbarDescription">发起批次并追踪自动化注册流程</span>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="topbar-clock" id="topbarClock"></span>
    <span class="system-health" title="WebUI 服务运行正常">
      <span class="system-health-dot" aria-hidden="true"></span>
      <span>服务在线</span>
    </span>
  </div>
</header>

<main>
  <!-- ============ 总览 ============ -->
  <div id="tab-overview">
    <div id="dashboard-page-root"
         data-module-url="{{ url_for('static', filename='task-center/dashboard.js', v=task_center_version) }}"
         data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
  </div>

  <!-- ============ 注册 ============ -->
  <div id="tab-register" class="hidden" data-module-view="launch">
    <div id="registrationRoot"
         data-module-url="{{ url_for('static', filename='task-center/registration.js', v=task_center_version) }}"
         data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
  </div>

  {% include 'partials/extract_stats.html' %}
  <section id="tab-extract-workbench" class="hidden" aria-label="提链工作台">
    <div id="extractWorkbenchRoot"
         data-module-url="{{ url_for('static', filename='task-center/extract.js', v=task_center_version) }}"
         data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
  </section>

  <!-- ============ 账号 ============ -->
  <section id="tab-bulk" class="hidden" aria-label="批量任务">
    <div id="bulk-page-root"
         data-module-url="{{ url_for('static', filename='task-center/bulk.js', v=task_center_version) }}"
         data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
  </section>
  <div id="tab-accounts" class="hidden" data-module-view="active">
    <h1 class="register-title">账号</h1>
    <section class="accounts-panel-v2" id="accountsPanelV2" aria-label="账号列表">
      <div id="accountToolbarHost"></div>
      <div id="accountRegistrationReceiptHost"></div>
      <div id="accountC2aReceiptHost"></div>
      <div id="accounts-list-root"
           data-module-url="{{ url_for('static', filename='task-center/accounts.js', v=task_center_version) }}"
           data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
    </section>
    <div id="accountDetailHost"></div>
    <div id="accountC2aConfirmHost"></div>
    <style>
      #accountInspectionStart, #accountInspectionHistory, #accountInspectionFailures { padding: 20px; max-height: 88dvh; overflow: auto; }
      #accountInspectionHistory, #accountInspectionFailures { width: min(1180px, calc(100vw - 28px)); }
      #accountInspectionStart .modal-header, #accountInspectionHistory .modal-header, #accountInspectionFailures .modal-header { display: flex; align-items: center; gap: 10px; }
      #accountInspectionStart h2, #accountInspectionHistory h2, #accountInspectionFailures h2 { flex: 1; font-size: 18px; margin: 0; }
      #accountInspectionStart p, #accountInspectionHistory p, #accountInspectionFailures p { color: var(--ui-color-text-secondary); line-height: 1.65; font-size: 13px; }
      #accountInspectionWorkers { display: block; margin: 8px 0; width: 100%; padding: 9px; }
      #accountInspectionStartError { color: var(--ui-color-danger); }
      #accountInspectionHistoryContent, #accountInspectionFailuresContent { overflow: auto; }
      [data-inspection-scroll] { overflow-x: auto; }
      [data-inspection-scroll] table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 13px; }
      [data-inspection-scroll] th, [data-inspection-scroll] td { padding: 10px; text-align: left; border-bottom: 1px solid var(--ui-color-border); }
      [data-inspection-scroll] td { vertical-align: top; }
      .inspection-error-reason { min-width: 240px; max-width: 460px; white-space: pre-wrap; overflow-wrap: anywhere; }
      #accountInspectionFailures td:nth-child(2) { max-width: 230px; overflow-wrap: anywhere; }
      #accountInspectionStart button, #accountInspectionHistory button, #accountInspectionFailures button { min-height: 34px; }
      @media (max-width: 640px) {
        #accountInspectionStart, #accountInspectionHistory, #accountInspectionFailures { padding: 14px; }
      }
    </style>
    <div id="accountEmailChangeHost"></div>
    <section class="account-tasks-panel" id="accountTasksPanel" aria-label="统一任务中心">
      <div id="task-center-root"
           data-module-url="{{ url_for('static', filename='task-center/task-center.js', v=task_center_version) }}"
           data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}">
        <p role="status">正在加载任务中心…</p>
      </div>
    </section>
    <div class="body hidden" id="liveLogPanel" role="dialog" aria-modal="true" aria-labelledby="liveLogTitle">
      <h3 id="liveLogTitle">查活日志：<span id="liveLogEmail" style="font-size:13px;font-weight:400;color:var(--muted);"></span>
        <button class="btn" id="btnCloseLiveLog" style="float:right;min-height:28px;">关闭</button>
      </h3>
      <div class="log" id="liveLogContent">加载中…</div>
    </div>
  </div>

  <!-- ============ Codex 授权 ============ -->
  <div id="tab-codex" class="hidden" data-module-view="active">
    <h1 class="register-title">Codex 授权</h1>
    <section id="codex-credentials-root"
      data-module-url="{{ url_for('static', filename='task-center/codex.js', v=task_center_version) }}"
      data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"
      aria-label="Codex 授权">
      <p role="status">正在加载授权凭证…</p>
    </section>
  </div>

  <!-- ============ 邮箱池 ============ -->
  <div id="tab-outlook" class="hidden" data-module-view="overview">
    <div id="email-page-root"
         data-module-url="{{ url_for('static', filename='task-center/email.js', v=task_center_version) }}"
         data-style-url="{{ url_for('static', filename='task-center/task-center.css', v=task_center_version) }}"></div>
